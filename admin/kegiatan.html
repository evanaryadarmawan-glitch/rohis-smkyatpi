<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Kegiatan — Admin ROHIS</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="../assets/img/logo.jpg">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="admin-body">
    <div class="admin-sidebar-overlay" id="adminOverlay" onclick="closeAdminSidebar()"></div>
    <div class="admin-shell">
        <aside class="admin-sidebar" id="adminSidebar">
            <div class="brand"><img src="../assets/img/logo.jpg" alt="Logo"><div class="brand-info"><h1>Admin ROHIS</h1><p style="color:#8fae9c;">YATPI GODONG</p></div></div>
            <nav class="admin-nav">
                <a href="dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a>
                <a href="kegiatan.html" class="active"><i class="fa-solid fa-images"></i> Kegiatan</a>
                <a href="pengurus.html"><i class="fa-solid fa-users"></i> Pengurus</a>
                <a href="pembina.html"><i class="fa-solid fa-chalkboard-user"></i> Pembina</a>
                <a href="jurnal.html"><i class="fa-solid fa-calendar-check"></i> Jurnal Yaumi</a>
                <a href="aspirasi.html"><i class="fa-solid fa-box-archive"></i> Kotak Aspirasi</a>
                <div class="divider"></div>
                <a href="pengaturan.html"><i class="fa-solid fa-gear"></i> Pengaturan</a>
                <a href="../index.html"><i class="fa-solid fa-arrow-up-right-from-square"></i> Lihat Situs</a>
                <a href="#" onclick="adminLogout()"><i class="fa-solid fa-right-from-bracket"></i> Keluar</a>
            </nav>
        </aside>

        <main class="admin-main">
            <div class="admin-topbar">
                <button class="admin-menu-btn" onclick="toggleAdminSidebar()"><i class="fa-solid fa-bars"></i></button>
                <h2>Kelola Kegiatan</h2>
                <button class="icon-btn" style="background:var(--primary);" onclick="toggleVisionMode()"><i class="v-icon fa-solid fa-moon"></i></button>
            </div>

            <div class="interactive-grid core-layout">
                <div class="panel-box">
                    <h4 id="formTitle"><i class="fa-solid fa-plus"></i> Tambah Kegiatan</h4>
                    <form id="kegiatanForm">
                        <input type="hidden" id="editId">
                        <div class="form-group"><label>Tag / Label</label><input type="text" id="fTag" placeholder="Contoh: Mingguan, Rutin Jumat Wage..." required></div>
                        <div class="form-group">
                            <label>Kategori Tampilan</label>
                            <select id="fKategori" required>
                                <option value="tahunan">Tahunan</option>
                                <option value="bulanan">Bulanan</option>
                                <option value="harian">Harian</option>
                            </select>
                        </div>
                        <div class="form-group"><label>Judul Kegiatan</label><input type="text" id="fTitle" placeholder="Judul kegiatan..." required></div>
                        <div class="form-group"><label>Deskripsi</label><textarea id="fDesc" rows="3" placeholder="Deskripsi singkat kegiatan..." required></textarea></div>
                        <div class="form-group">
                            <label>Foto Kegiatan</label>
                            <input type="file" id="fImgFile" accept="image/*" onchange="handleImgUpload(event)">
                            <input type="hidden" id="fImg" required>
                            <img id="imgPreview" style="display:none;width:100%;max-height:180px;object-fit:cover;border-radius:8px;margin-top:8px;">
                        </div>
                        <button type="submit" class="btn-action"><i class="fa-solid fa-floppy-disk"></i> Simpan Kegiatan</button>
                        <button type="button" class="btn-outline" style="margin-top:8px;display:none;" id="cancelEditBtn" onclick="cancelEdit()">Batal Edit</button>
                    </form>
                </div>

                <div class="panel-box">
                    <h4><i class="fa-solid fa-list"></i> Daftar Kegiatan</h4>
                    <div id="kegiatanList"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="../assets/js/firebase-config.js"></script>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/admin.js"></script>
    <script>
        function renderList() {
            const data = ROHIS.getActivities();
            const el = document.getElementById('kegiatanList');
            if (data.length === 0) { el.innerHTML = '<div class="empty-state">Belum ada kegiatan. Tambahkan di form sebelah kiri.</div>'; return; }
            const kategoriLabel = { tahunan: 'Tahunan', bulanan: 'Bulanan', harian: 'Harian' };
            el.innerHTML = data.map(a => `
                <div class="card" style="display:flex;gap:12px;padding:12px;margin-bottom:10px;align-items:center;">
                    <img src="${a.img}" style="width:60px;height:60px;border-radius:8px;object-fit:cover;flex-shrink:0;" onerror="this.src='../assets/img/logo.jpg'">
                    <div style="flex:1;min-width:0;">
                        <span class="pill pill-green">${a.tag}</span>
                        <span class="pill pill-green" style="margin-left:4px;">${kategoriLabel[getKategoriKegiatan(a)]}</span>
                        <h5 style="font-size:13px;margin:4px 0 2px 0;">${a.title}</h5>
                        <p style="font-size:11px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${a.desc}</p>
                    </div>
                    <div style="display:flex;flex-direction:column;gap:6px;">
                        <button class="btn-secondary" style="background:var(--primary);" onclick="editItem('${a.id}')"><i class="fa-solid fa-pen"></i></button>
                        <button class="btn-secondary btn-danger" onclick="deleteItem('${a.id}')"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function handleImgUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (ev) {
                document.getElementById('fImg').value = ev.target.result;
                const preview = document.getElementById('imgPreview');
                preview.src = ev.target.result;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        document.getElementById('kegiatanForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            if (!document.getElementById('fImg').value) {
                alert('Silakan pilih foto kegiatan terlebih dahulu.');
                return;
            }
            const item = {
                tag: document.getElementById('fTag').value,
                kategori: document.getElementById('fKategori').value,
                title: document.getElementById('fTitle').value,
                desc: document.getElementById('fDesc').value,
                img: document.getElementById('fImg').value
            };
            if (id) { ROHIS.updateActivity(id, item); } else { ROHIS.addActivity(item); }
            this.reset();
            document.getElementById('imgPreview').style.display = 'none';
            document.getElementById('imgPreview').src = '';
            cancelEdit();
            renderList();
        });

        function editItem(id) {
            const item = ROHIS.getActivities().find(a => a.id === id);
            if (!item) return;
            document.getElementById('editId').value = id;
            document.getElementById('fTag').value = item.tag;
            document.getElementById('fKategori').value = getKategoriKegiatan(item);
            document.getElementById('fTitle').value = item.title;
            document.getElementById('fDesc').value = item.desc;
            document.getElementById('fImg').value = item.img;
            const preview = document.getElementById('imgPreview');
            preview.src = item.img;
            preview.style.display = 'block';
            document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-pen"></i> Edit Kegiatan';
            document.getElementById('cancelEditBtn').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelEdit() {
            document.getElementById('editId').value = '';
            document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-plus"></i> Tambah Kegiatan';
            document.getElementById('cancelEditBtn').style.display = 'none';
        }

        function deleteItem(id) {
            if (confirm('Hapus kegiatan ini?')) { ROHIS.deleteActivity(id); renderList(); }
        }

        renderList();
        window.addEventListener('rohis:sync', function (e) { if (!e.detail || e.detail.key === 'activities') renderList(); });
    </script>
</body>
</html>
