<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kotak Aspirasi — Admin ROHIS</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="../assets/img/logo.jpg">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="admin-body">
    <div class="admin-sidebar-overlay" id="adminOverlay" onclick="closeAdminSidebar()"></div>
    <div class="admin-shell">
        <aside class="admin-sidebar" id="adminSidebar">
            <div class="brand"><img src="../assets/img/logo.jpg" alt="Logo"><div class="brand-info"><h1>Admin ROHIS</h1><p style="color:#8fae9c;">YATPI GODONG</p></div></div>
            <nav class="admin-nav">
                <a href="dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a>
                <a href="kegiatan.html"><i class="fa-solid fa-images"></i> Kegiatan</a>
                <a href="pengurus.html"><i class="fa-solid fa-users"></i> Pengurus</a>
                <a href="pembina.html"><i class="fa-solid fa-chalkboard-user"></i> Pembina</a>
                <a href="jurnal.html"><i class="fa-solid fa-calendar-check"></i> Jurnal Yaumi</a>
                <a href="aspirasi.html" class="active"><i class="fa-solid fa-box-archive"></i> Kotak Aspirasi</a>
                <div class="divider"></div>
                <a href="pengaturan.html"><i class="fa-solid fa-gear"></i> Pengaturan</a>
                <a href="../index.html"><i class="fa-solid fa-arrow-up-right-from-square"></i> Lihat Situs</a>
                <a href="#" onclick="adminLogout()"><i class="fa-solid fa-right-from-bracket"></i> Keluar</a>
            </nav>
        </aside>

        <main class="admin-main">
            <div class="admin-topbar">
                <button class="admin-menu-btn" onclick="toggleAdminSidebar()"><i class="fa-solid fa-bars"></i></button>
                <h2>Kotak Aspirasi</h2>
                <button class="icon-btn" style="background:var(--primary);" onclick="toggleVisionMode()"><i class="v-icon fa-solid fa-moon"></i></button>
            </div>

            <div class="panel-box">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap;">
                    <h4 style="margin:0;"><i class="fa-solid fa-box-archive"></i> Aspirasi Anonim Masuk</h4>
                    <button class="btn-secondary btn-danger" onclick="clearAll()"><i class="fa-solid fa-trash-can"></i> Hapus Semua</button>
                </div>
                <div id="aspirasiList"></div>
            </div>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="../assets/js/firebase-config.js"></script>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/admin.js"></script>
    <script>
        function renderList() {
            const data = ROHIS.getAspirasi().slice().reverse();
            const el = document.getElementById('aspirasiList');
            if (data.length === 0) { el.innerHTML = '<div class="empty-state">Belum ada aspirasi masuk.</div>'; return; }
            el.innerHTML = data.map(a => `
                <div class="card" style="padding:14px;margin-bottom:10px;">
                    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px;">
                        <div>
                            <span class="pill pill-green">${a.kategori}</span>
                            <span style="font-size:11px;color:var(--text-muted);margin-left:8px;">${a.waktu}</span>
                        </div>
                        <button class="btn-secondary btn-danger" onclick="deleteItem('${a.id}')"><i class="fa-solid fa-trash"></i></button>
                    </div>
                    <p style="font-size:13px;color:var(--text-main);">${a.isi}</p>
                </div>
            `).join('');
        }
        function deleteItem(id) { if (confirm('Hapus aspirasi ini?')) { ROHIS.deleteAspirasi(id); renderList(); } }
        function clearAll() { if (confirm('Hapus SEMUA aspirasi? Tindakan ini tidak dapat dibatalkan.')) { ROHIS.clearAspirasi(); renderList(); } }
        renderList();
        window.addEventListener('rohis:sync', function (e) { if (!e.detail || e.detail.key === 'aspirasi') renderList(); });
    </script>
</body>
</html>
